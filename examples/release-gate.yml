# Drop-in CI gate: commit the manifest at release time, diff every later build
# against it. Fails the job when a file is added, removed, or changed.
name: dist-audit

on:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Manifest the wheel
        run: |
          pip install tiny-dist-audit
          for whl in dist/*.whl; do
            tiny-dist-audit check "$whl" \
              --baseline dist-manifest.json \
              --fail-on high
          done
